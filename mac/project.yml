name: Marquee

options:
  bundleIdPrefix: com.timmyamant
  deploymentTarget:
    macOS: "15.0"
    iOS: "18.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    # CI stamps the release version (package.json) over these; see
    # .github/workflows/apps.yml. The updater compares it with the release tag.
    MARKETING_VERSION: "0.56.0"
    CURRENT_PROJECT_VERSION: "1"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    # Swift 6 language mode: complete data-race safety checking, plus the
    # Swift 6.2 "approachable concurrency" upcoming features (nonisolated
    # async functions run on the caller's actor, inferred isolated conformances).
    SWIFT_VERSION: "6.0"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    # Localization (Resources/Localizable.xcstrings, docs/i18n-glossary.md):
    # the compiler extracts every localizable literal into .stringsdata, which
    # Scripts/check-strings.sh compares with the catalog in CI.
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      # No get-task-allow in a download: debuggers can't attach to it.
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO

targets:
  Marquee:
    type: application
    platform: macOS
    sources:
      - path: Marquee
      # The release notes this build ships with, for "What's new" after an
      # app-only update (App/WhatsNew.swift reads it as it is).
      - path: ../lib/changelog.ts
        buildPhase: resources
    info:
      path: Marquee/Resources/Info.plist
      properties:
        CFBundleName: Marquee
        CFBundleDisplayName: Marquee
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundlePackageType: APPL
        CFBundleDevelopmentRegion: en
        # The languages Marquee ships (Resources/*.xcstrings); macOS offers
        # them in System Settings › General › Language & Region › Applications.
        CFBundleLocalizations: [en, es, fr, de, pt-BR]
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.entertainment
        NSHumanReadableCopyright: "Marquee — self-hosted media dashboard. MIT License."
        NSLocalNetworkUsageDescription: "Marquee looks for your Marquee server on your home network (such as the one on your Unraid box) and connects to it, so you can browse your library and send requests from this Mac."
        # Arbitrary loads only: when NSAllowsLocalNetworking is also present
        # macOS ignores this key, blocking plain http:// to named LAN hosts.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        CFBundleURLTypes:
          - CFBundleURLName: com.timmyamant.Marquee
            CFBundleURLSchemes:
              - marquee
    # No App Sandbox, so no entitlements: the in-app updater has to replace
    # Marquee.app itself, which a sandboxed app can't. The hardened runtime
    # stays on. The first unsandboxed launch brings the sandbox container's
    # settings across (App/SandboxMigration.swift).
    settings:
      base:
        PRODUCT_NAME: Marquee
        PRODUCT_BUNDLE_IDENTIFIER: com.timmyamant.Marquee
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
        DEVELOPMENT_ASSET_PATHS: "\"Marquee/Preview Content\""
        ENABLE_PREVIEWS: YES
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"

  # The iPhone (and iPad) app: the Mac app's API client, models, design
  # system and most screens, compiled for iOS, with its own shell (tab bar,
  # sign-in, compact Settings) in MarqueeiOS/. Mac-only files are left out
  # here; shared files keep AppKit behind `#if os(macOS)`.
  Marquee iOS:
    type: application
    platform: iOS
    sources:
      - path: Marquee
        excludes:
          - App/MarqueeApp.swift
          - App/MarqueeCommands.swift
          - App/SandboxMigration.swift
          # The Mac keeps its token in a file (ad-hoc signing breaks the login
          # Keychain across updates); iOS uses the Keychain (KeychainTokenStore).
          - Connection/FileTokenStore.swift
          - Core/Security/CodeIdentity.swift
          - Core/Security/Keychain.swift
          - App/Updates/**
          - Features/Settings/**
          - Features/Shell/**
          - Resources/Assets.xcassets/**
          - Resources/Info.plist
          - Resources/InfoPlist.xcstrings
          - Preview Content/**
      # The few Mac-folder files the iPhone app needs from excluded folders.
      - path: Marquee/App/Updates/UpdateModels.swift
        group: MarqueeiOS/Shared
      - path: Marquee/Features/Settings/LastActiveLabel.swift
        group: MarqueeiOS/Shared
      - path: Marquee/Features/Shell/SearchPanel.swift
        group: MarqueeiOS/Shared
      - path: Marquee/Features/Shell/WhatsNewSheet.swift
        group: MarqueeiOS/Shared
      - path: MarqueeiOS
      - path: ../lib/changelog.ts
        buildPhase: resources
    info:
      path: MarqueeiOS/Resources/Info.plist
      properties:
        CFBundleName: Marquee
        CFBundleDisplayName: Marquee
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundlePackageType: APPL
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, es, fr, de, pt-BR]
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: "Marquee looks for your Marquee server on your home network (such as the one on your Unraid box) and connects to it, so you can browse your library and send requests from this iPhone."
        # A home server is usually plain http:// on the LAN or a custom domain.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        CFBundleURLTypes:
          - CFBundleURLName: com.timmyamant.Marquee
            CFBundleURLSchemes:
              - marquee
    settings:
      base:
        PRODUCT_NAME: Marquee
        # The same module name as the Mac app, so shared tests
        # (`@testable import Marquee`) compile against either.
        PRODUCT_MODULE_NAME: Marquee
        PRODUCT_BUNDLE_IDENTIFIER: com.timmyamant.Marquee.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        # Simulator builds (and CI) are signed to run locally, which is all
        # the Keychain needs there. A device build needs a team: set
        # DEVELOPMENT_TEAM (Automatic signing) for TestFlight/App Store.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
        ENABLE_PREVIEWS: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"

  MarqueeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MarqueeTests
        excludes:
          - Fixtures
      # Example responses from Docs/api-v1.md (Scripts/extract-api-fixtures.py),
      # copied as a folder so tests find them under Fixtures/api/.
      - path: MarqueeTests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: Marquee
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.timmyamant.MarqueeTests
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Marquee.app/Contents/MacOS/Marquee"
        BUNDLE_LOADER: "$(TEST_HOST)"

  # The iPhone app's tests: the shared model/API tests that don't touch
  # Mac-only code, run against the iOS build, plus MarqueeiOSTests/ (the tab
  # bar's navigation, the Keychain token store, platform wording).
  MarqueeiOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MarqueeiOSTests
      - path: MarqueeTests
        excludes:
          - Fixtures
          - Fixtures/**
          # Mac-only: the sessions file, the updater, the rail, and Settings
          # screens the iPhone app doesn't have.
          - FileTokenStoreTests.swift
          - UpdaterTests.swift
          - NavRailPositionTests.swift
          - PermissionsTests.swift
          - DiscoverRowsTests.swift
          - ApiKeysTests.swift
          - PersonalNotificationsTests.swift
          - ArrServersTests.swift
      - path: MarqueeTests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: Marquee iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.timmyamant.MarqueeiOSTests
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Marquee.app/Marquee"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  Marquee:
    build:
      targets:
        Marquee: all
        MarqueeTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      # The tests check English text: run the host app in English whatever
      # this Mac's language or Marquee's saved account language.
      commandLineArguments:
        "-AppleLanguages (en)": true
      targets:
        - MarqueeTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  Marquee iOS:
    build:
      targets:
        Marquee iOS: all
        MarqueeiOSTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      commandLineArguments:
        "-AppleLanguages (en)": true
      targets:
        - MarqueeiOSTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
