name: CI

# Checks every push and pull request, so a broken build is caught when it
# lands rather than when the next release image fails to build.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Website (lint, types, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx eslint .
      - run: npx tsc --noEmit
      - run: npm test
      - name: Build
        run: npm run build
        env:
          # Same placeholder the Dockerfile uses: the build imports the DB
          # client but never connects.
          DATABASE_URL: postgres://build:build@build-time-placeholder:5432/build
          NEXT_TELEMETRY_DISABLED: 1

  mac:
    name: Mac app (build and tests)
    # The app needs a current SDK (it relies on AppKit types that are only
    # Sendable from the macOS 26 SDK on), so this runs on the newest image
    # and its default Xcode rather than macos-15's Xcode 16.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version
      - run: brew install xcodegen
      - name: Generate project
        working-directory: mac
        run: xcodegen generate
      - name: Build and test
        working-directory: mac
        run: |
          set -o pipefail
          xcodebuild -project Marquee.xcodeproj -scheme Marquee \
            -destination 'platform=macOS' -derivedDataPath build/DerivedData \
            test | tee xcodebuild.log
          if grep -Eq '\.swift:[0-9]+:[0-9]+: warning:' xcodebuild.log; then
            echo "::error::The Mac build has compiler warnings — it's kept at zero."
            grep -E '\.swift:[0-9]+:[0-9]+: warning:' xcodebuild.log | sort -u
            exit 1
          fi

  windows:
    name: Windows app (Core tests and build)
    # Marquee.Core and its tests are platform neutral and would run on Linux,
    # but the WinUI app itself only builds on Windows, so both steps share
    # one runner rather than paying for a second checkout and restore.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      # Warnings are already errors through windows/Directory.Build.props,
      # so unlike the Mac job there is no build log to grep afterwards.
      - name: Core tests
        run: dotnet test windows/Marquee.Core.Tests/Marquee.Core.Tests.csproj -c Release
      # The app is built with Visual Studio's MSBuild rather than `dotnet
      # build`: the Windows App SDK's resource (PRI) step loads a packaging
      # task that only ships with Visual Studio, which windows-latest has.
      # A WinUI project has to be built for one concrete platform, so this
      # passes x64; only the app project is built, not the .sln, so the Core
      # projects aren't compiled a second time.
      - uses: microsoft/setup-msbuild@v2
      - name: Build the app
        run: msbuild windows/Marquee.Windows/Marquee.Windows.csproj -restore -p:Configuration=Release -p:Platform=x64 -v:minimal
