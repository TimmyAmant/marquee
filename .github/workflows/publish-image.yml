name: Publish image

# Every published release builds the image and pushes it to GitHub Packages,
# so a release never depends on someone's laptop being switched on.
on:
  release:
    types: [published]
  workflow_dispatch:

# One at a time, in order: two releases close together could otherwise
# finish out of order and leave :latest on the older one.
concurrency:
  group: publish-image
  cancel-in-progress: false

jobs:
  publish:
    # A manual run from any other branch would overwrite :latest (and the
    # version tag) with unreleased code, so only main and full releases
    # publish; a pre-release (a test build of the apps) doesn't.
    if: (github.event_name == 'release' && !github.event.release.prerelease) || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Work out the tags
        id: meta
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${{ github.event_name }}" = "release" ] && [ "${{ github.event.release.tag_name }}" != "v$version" ]; then
            echo "::error::Release tag ${{ github.event.release.tag_name }} doesn't match package.json (v$version)."
            exit 1
          fi
          echo "tags=ghcr.io/${GITHUB_REPOSITORY,,}:latest,ghcr.io/${GITHUB_REPOSITORY,,}:${version}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
