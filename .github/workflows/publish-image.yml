name: Publish image

# Every published release builds the image and pushes it to GitHub Packages,
# so a release never depends on someone's laptop being switched on.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Work out the tags
        id: meta
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "tags=ghcr.io/${GITHUB_REPOSITORY,,}:latest,ghcr.io/${GITHUB_REPOSITORY,,}:${version}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
