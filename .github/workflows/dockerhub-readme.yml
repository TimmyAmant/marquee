# Keeps the Docker Hub page (timmyamant/marquee) showing the same README as
# GitHub. Runs when README.md changes on main, or by hand.
#
# Needs two repository secrets (Settings › Secrets and variables › Actions):
#   DOCKERHUB_USERNAME  timmyamant
#   DOCKERHUB_TOKEN     a Docker Hub personal access token with
#                       "Read, Write, Delete" access (Docker Hub › Account
#                       settings › Personal access tokens)
# Without them the job is skipped rather than failing.
name: Docker Hub README

on:
  push:
    branches: [main]
    paths: ["README.md", "docs/screenshots/**", "scripts/dockerhub-readme.mjs", ".github/workflows/dockerhub-readme.yml"]
  workflow_dispatch:

# Reads the README; Docker Hub is updated with its own token.
permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the Docker Hub secrets
        id: secrets
        env:
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: echo "present=$([ -n "$TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Make relative links absolute
        if: steps.secrets.outputs.present == 'true'
        run: node scripts/dockerhub-readme.mjs README.dockerhub.md
      - name: Update the Docker Hub description
        if: steps.secrets.outputs.present == 'true'
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: timmyamant/marquee
          short-description: "Self-hosted movie & TV requests and library for Plex, Jellyfin/Emby, Sonarr and Radarr"
          readme-filepath: ./README.dockerhub.md
