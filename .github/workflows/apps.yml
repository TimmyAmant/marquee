name: App downloads

# Builds the Mac and Windows apps as ready-to-install downloads:
#   Marquee-<version>.dmg        open it, drag Marquee into Applications
#   Marquee-Setup-<version>.exe  a per-user Windows installer (no admin
#                                prompt), with its SHA-256: what the Windows
#                                app's own Update button downloads
#   Marquee-mac.zip              the same Mac app zipped, with its SHA-256:
#                                what the Mac app's own Update button downloads
#   Marquee-Setup.exe            the same installer under its old name, with
#                                its SHA-256, for 0.30.0's updater, which
#                                looks for that name
# The version in the names keeps a Downloads folder of several releases
# readable.
# Pull requests and main keep them as run artifacts for trying a change;
# a published release gets them attached as assets, which is where the
# download links (README, website) and the Mac updater point.
on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac:
    name: Mac app download
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - name: Work out the version
        id: version
        # The app's version is the server's: the updater compares it with
        # the release tag, which is package.json's version.
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Check the release tag matches package.json
        if: github.event_name == 'release'
        shell: bash
        # A release whose tag isn't the built version would make the Mac
        # updater reject every download and the Windows one reinstall the old
        # build forever: stop before anything is attached.
        run: |
          expected="v${{ steps.version.outputs.version }}"
          if [ "${{ github.event.release.tag_name }}" != "$expected" ]; then
            echo "::error::Release tag ${{ github.event.release.tag_name }} doesn't match package.json ($expected)."
            exit 1
          fi
      - name: Build
        working-directory: mac
        run: |
          set -o pipefail
          xcodegen generate
          xcodebuild -project Marquee.xcodeproj -scheme Marquee -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath build/DerivedData \
            MARKETING_VERSION=${{ steps.version.outputs.version }} \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            build | tail -20
      - name: Package
        run: |
          app=mac/build/DerivedData/Build/Products/Release/Marquee.app
          codesign --verify --deep --strict "$app"
          mkdir -p dist
          # ditto keeps the bundle's symlinks, permissions and signature intact
          # (a plain zip can break the signature).
          ditto -c -k --keepParent "$app" dist/Marquee-mac.zip
          (cd dist && shasum -a 256 Marquee-mac.zip > Marquee-mac.zip.sha256)
          cat dist/Marquee-mac.zip.sha256
          # The disk image people download: the app next to a shortcut to
          # Applications on a branded background with an arrow between them,
          # so installing is one drag, plus a Read Me (first launch, updates).
          # Laid out by mac/Scripts/dmg-settings.py; the window title carries
          # the version.
          python3 -m venv "$RUNNER_TEMP/dmgbuild"
          # Pinned: dmg-settings.py is Python dmgbuild runs, and a renamed
          # setting in a newer release would be dropped without an error.
          "$RUNNER_TEMP/dmgbuild/bin/pip" install --quiet dmgbuild==1.6.5
          "$RUNNER_TEMP/dmgbuild/bin/dmgbuild" -s mac/Scripts/dmg-settings.py -D app="$app" \
            "Marquee ${{ steps.version.outputs.version }}" "dist/Marquee-${{ steps.version.outputs.version }}.dmg"
          # The same image under its old name, which links published before
          # 0.30.1 (releases/latest/download/Marquee.dmg) still point at.
          cp "dist/Marquee-${{ steps.version.outputs.version }}.dmg" dist/Marquee.dmg
          # The layout is written into the image, not checked by anything
          # else: make sure what people will see is there.
          mount="$(mktemp -d)"
          hdiutil attach -quiet -nobrowse -readonly -mountpoint "$mount" dist/Marquee.dmg
          for item in Marquee.app Applications "Read Me.txt" .background.tiff .DS_Store; do
            [ -e "$mount/$item" ] || { echo "::error::The disk image is missing $item"; hdiutil detach -quiet "$mount"; exit 1; }
          done
          hdiutil detach -quiet "$mount"
      # The ditto zip goes inside the artifact rather than the bare .app:
      # GitHub's own zipping of an artifact drops the symlinks and executable
      # bits a Mac app bundle needs.
      - uses: actions/upload-artifact@v4
        with:
          name: Marquee-mac-${{ steps.version.outputs.version }}
          path: dist/

  windows:
    name: Windows app download
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: microsoft/setup-msbuild@v2
      - name: Work out the version
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Check the release tag matches package.json
        if: github.event_name == 'release'
        shell: bash
        # A release whose tag isn't the built version would make the Mac
        # updater reject every download and the Windows one reinstall the old
        # build forever: stop before anything is attached.
        run: |
          expected="v${{ steps.version.outputs.version }}"
          if [ "${{ github.event.release.tag_name }}" != "$expected" ]; then
            echo "::error::Release tag ${{ github.event.release.tag_name }} doesn't match package.json ($expected)."
            exit 1
          fi
      - name: Publish
        # Self-contained: the .NET runtime ships in the folder alongside the
        # Windows App SDK runtime (already self-contained in the project), so
        # the installer needs nothing else on the PC.
        run: >
          msbuild windows/Marquee.Windows/Marquee.Windows.csproj -restore -t:Publish
          -p:Configuration=Release -p:Platform=x64 -p:RuntimeIdentifier=win-x64
          -p:SelfContained=true -p:PublishDir=${{ runner.temp }}\Marquee\ -v:minimal
          -p:Version=${{ steps.version.outputs.version }}
      - name: Check the published app
        shell: pwsh
        # The app's own .pri holds its compiled XAML; without it the app
        # can't draw a single window (it happened: see the csproj).
        run: |
          Get-ChildItem "${{ runner.temp }}\Marquee" -Filter *.pri | ForEach-Object { $_.Name }
          if (-not (Get-ChildItem "${{ runner.temp }}\Marquee" -Filter *.pri | Where-Object { $_.Name -in 'resources.pri', 'Marquee.Windows.pri' })) {
            throw "The published app has no resources.pri / Marquee.Windows.pri."
          }
      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y | Out-Null }
          New-Item -ItemType Directory -Force dist | Out-Null
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" "/DSourceDir=${{ runner.temp }}\Marquee" "/O$PWD\dist" windows\installer\Marquee.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # The app's updater checks the installer it downloads against this
          # (and GitHub's own digest of the asset, when it has one).
          $setup = "Marquee-Setup-${{ steps.version.outputs.version }}.exe"
          $hash = (Get-FileHash "dist\$setup" -Algorithm SHA256).Hash.ToLower()
          "$hash  $setup" | Out-File -Encoding ascii "dist\$setup.sha256"
          # The same installer under the name 0.30.0's updater looks for.
          Copy-Item "dist\$setup" dist\Marquee-Setup.exe
          "$hash  Marquee-Setup.exe" | Out-File -Encoding ascii dist\Marquee-Setup.exe.sha256
          Get-ChildItem dist
      - uses: actions/upload-artifact@v4
        with:
          name: Marquee-Setup-${{ steps.version.outputs.version }}
          # Everything the release gets: the versioned installer, its old
          # name for 0.30.0's updater, and both checksums.
          path: dist/
      # Installs and launches the app for real, the way someone downloading
      # it would, and fails the build if it doesn't stay up: a compile that
      # passes can still die on launch (a XAML resource that won't parse, a
      # runtime file publish left out). The crash log (CrashReporter) and
      # Windows' own error events are printed, and a screenshot is kept.
      - name: Install and launch
        shell: pwsh
        env:
          MARQUEE_NO_CRASH_DIALOG: "1"
        run: |
          $start = Get-Date
          Start-Process -FilePath "dist\Marquee-Setup-${{ steps.version.outputs.version }}.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\Marquee\Marquee.Windows.exe'
          if (-not (Test-Path $exe)) { throw "The installer didn't put Marquee.Windows.exe at $exe" }
          $app = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 20
          $alive = -not $app.HasExited
          New-Item -ItemType Directory -Force smoke | Out-Null
          try {
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $shot = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
            [System.Drawing.Graphics]::FromImage($shot).CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
            $shot.Save("$PWD\smoke\screen.png")
          } catch { "Couldn't take a screenshot: $_" }
          $crashLog = Join-Path $env:LOCALAPPDATA 'Marquee\crash.log'
          if (Test-Path $crashLog) { "---- crash.log"; Get-Content $crashLog; Copy-Item $crashLog smoke\ }
          Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = $start } -ErrorAction SilentlyContinue |
            Where-Object { $_.ProviderName -in '.NET Runtime', 'Application Error', 'Windows Error Reporting', 'SideBySide' } |
            ForEach-Object { "---- $($_.ProviderName) $($_.Id)"; $_.Message }
          if (-not $alive -or (Test-Path $crashLog)) {
            # WinUI writes the real reason for a XAML failure (the file, line
            # and position) only to the debugger, so run it once more under
            # cdb and print what it says.
            $cdb = "${env:ProgramFiles(x86)}\Windows Kits\10\Debuggers\x64\cdb.exe"
            if (Test-Path $cdb) {
              Remove-Item $crashLog -ErrorAction SilentlyContinue
              $debugLog = "$PWD\smoke\debugger.txt"
              $debugger = Start-Process -FilePath $cdb -ArgumentList '-g', '-G', '-logo', "`"$debugLog`"", '-c', '"sxn *; g; q"', "`"$exe`"" -PassThru -WindowStyle Hidden
              if (-not $debugger.WaitForExit(90000)) { Stop-Process -Id $debugger.Id -Force; Get-Process Marquee.Windows -ErrorAction SilentlyContinue | Stop-Process -Force }
              "---- debugger output (WinUI and XAML lines)"
              Get-Content $debugLog -ErrorAction SilentlyContinue | Select-String -Pattern 'XAML|Xaml|WinUI|Error|error|Line|Position|Exception|Cannot' | Select-Object -First 80 | ForEach-Object { $_.Line }
            } else { "cdb isn't on this runner at $cdb" }
          }
          if (-not $alive) { throw "Marquee exited on startup (exit code $($app.ExitCode))." }
          if (Test-Path $crashLog) { throw "Marquee is running but logged a crash." }
          "Marquee is up after 20 seconds."
          Stop-Process -Id $app.Id
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Marquee-smoke-test
          path: smoke/
          if-no-files-found: ignore

  # Both apps' files go onto the release together, and only once both built
  # and passed: a release with only one app's download would be "latest" to
  # the other app's updater with nothing to install.
  attach:
    name: Attach to the release
    if: github.event_name == 'release'
    needs: [mac, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Marquee-{mac,Setup}-*
          path: assets
          merge-multiple: true
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la assets
          gh release upload "${{ github.event.release.tag_name }}" assets/* --repo "${{ github.repository }}" --clobber
