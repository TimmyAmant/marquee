name: Bug report
description: Something in Marquee isn't working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Marquee version
      description: The version in the page footer, e.g. 0.24.2.
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where?
      options: [Website, Mac app, Both]
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: How are you running it?
      placeholder: Unraid Community Applications, Docker Compose, something else
  - type: textarea
    id: logs
    attributes:
      label: Container logs, if any
      render: shell
